[package]
name = "fflume"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight desktop toolkit for FFmpeg"
license = "GPL-3.0-only"
build = "build.rs"

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-software = ["slint/renderer-software"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
slint = { version = "~1.18.1", default-features = false, features = ["backend-winit", "compat-1-18", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = "0.18"

[build-dependencies]
slint-build = "~1.18.1"

[profile.release]
lto = "thin"
strip = "symbols"
panic = "abort"
